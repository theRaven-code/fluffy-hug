<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Fluffy Animals - Digital Art Showcase</title>
    <meta name="title" content="Fluffy Animals - Digital Art Showcase" />
    <meta
      name="description"
      content="Experience the joy of living surrounded by fluffy animals. A digital showcase for pet and animal lovers."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fluffy-animals.com/" />
    <meta property="og:title" content="Fluffy Animals - Digital Art Showcase" />
    <meta
      property="og:description"
      content="Experience the joy of living surrounded by fluffy animals. A digital showcase for pet and animal lovers."
    />
    <meta property="og:image" content="/images/og-image.webp" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://fluffy-animals.com/" />
    <meta
      property="twitter:title"
      content="Fluffy Animals - Digital Art Showcase"
    />
    <meta
      property="twitter:description"
      content="Experience the joy of living surrounded by fluffy animals. A digital showcase for pet and animal lovers."
    />
    <meta property="twitter:image" content="/images/og-image.webp" />

    <!-- Additional Meta Tags -->
    <meta
      name="keywords"
      content="fluffy animals, pets, digital art, animal lovers, cute animals, interactive art"
    />
    <meta name="author" content="Fluffy Animals" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#fcf6ec" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://fluffy-animals.com/" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Fluffy Animals",
        "url": "https://fluffy-animals.com/",
        "description": "Experience the joy of living surrounded by fluffy animals. A digital showcase for pet and animal lovers.",
        "image": "/images/og-image.webp",
        "author": {
          "@type": "Organization",
          "name": "Fluffy Animals"
        }
      }
    </script>

    <link rel="stylesheet" href="src/index.css" />
  </head>
  <body>
    <div id="root" role="main"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
